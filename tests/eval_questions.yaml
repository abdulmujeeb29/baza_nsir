# Evaluation set: the 12 questions from the project brief (section 8).
# expect_contains: every string must appear in the answer text or the result table.
# expect_values: each value must appear in the answer text (rounding allowed, e.g. 13.2 million for 13246394).
# expect_tables: the answer must cite at least one table whose table_id contains one of these strings.
